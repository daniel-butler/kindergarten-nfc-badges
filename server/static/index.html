<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classroom Zoo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <input id="wedge" aria-hidden="true" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div id="sky" aria-hidden="true">
    <span class="sun">🌞</span>
    <span class="cloud c1">☁️</span>
    <span class="cloud c2">☁️</span>
    <span class="cloud c3">☁️</span>
    <div class="hill"></div>
  </div>
  <main id="scene" class="scene"></main>
  <canvas id="confetti"></canvas>
  <div id="banner" hidden></div>
  <button id="panel-hotspot" aria-label="Presenter panel"></button>
  <aside id="panel" hidden></aside>
  <div id="start">
    <div class="start-box">
      <div class="start-emoji">🔊</div>
      <div>Click to start</div>
      <div class="start-hint">Option+P: presenter panel</div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
