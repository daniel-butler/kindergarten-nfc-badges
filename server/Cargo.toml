[package]
name = "badge-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
if-addrs = "0.15.0"
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
