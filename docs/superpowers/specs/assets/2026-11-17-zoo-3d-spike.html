<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zoo 3D Spike</title>
<style>
  :root { --ink: #1d2251; --accent: #ff7a3d; --paper: #fffaf0; }
  html, body { margin: 0; height: 100%; background: #1d2251; color: var(--paper);
    font-family: "Chalkboard SE", ui-rounded, system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 12px 18px; }
  #view { position: relative; width: min(100%, calc((100vh - 110px) * 16 / 9)); aspect-ratio: 16 / 9;
    border-radius: 12px; overflow: hidden; background: #8fd8ff; }
  #view canvas { display: block; width: 100%; height: 100%; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button { font: 700 18px inherit; font-family: inherit; padding: 12px 22px; border-radius: 999px;
    border: 3px solid var(--paper); background: var(--accent); color: #fff; cursor: pointer; }
  button.alt { background: transparent; }
  .hint { font-size: 14px; opacity: 0.85; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div id="view"></div>
  <div class="bar">
    <button id="go">🏷️ Tap a badge</button>
    <button id="all" class="alt">Send everyone</button>
    <span class="hint" id="hint"></span>
  </div>
  <div class="hint">Throwaway 3D spike · turn your phone sideways for a bigger view</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const ANIMALS = [
  ['🐧', 'Penguin', '🐟'], ['🐵', 'Monkey', '🍌'], ['🦁', 'Lion', '🍖'], ['🐘', 'Elephant', '🥜'],
  ['🦒', 'Giraffe', '🍃'], ['🐰', 'Bunny', '🥕'], ['🐻', 'Bear', '🍯'], ['🐼', 'Panda', '🎋'],
  ['🦓', 'Zebra', '🌾'], ['🐯', 'Tiger', '🍖'], ['🐨', 'Koala', '🌿'], ['🦊', 'Fox', '🫐'],
  ['🐸', 'Frog', '🪰'], ['🦉', 'Owl', '🐭'], ['🐢', 'Turtle', '🥬'], ['🦄', 'Unicorn', '🍭'],
  ['🐬', 'Dolphin', '🐟'], ['🦘', 'Kangaroo', '🌱'],
].map(([emoji, name, food], i) => ({ emoji, name, food, color: ['#E53935', '#FB8C00', '#FDD835', '#43A047', '#1E5BD8', '#8E24AA', '#F48FB1', '#81D4FA'][i % 8] }));
const KIDS = ['🧒', '👧', '👦', '🧒🏽', '👧🏾', '👦🏻', '🧒🏿', '👧🏼'];

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#8fd8ff');
scene.fog = new THREE.Fog('#8fd8ff', 55, 110);
const camera = new THREE.PerspectiveCamera(50, 16 / 9, 0.1, 300);
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

scene.add(new THREE.HemisphereLight('#ffffff', '#5aa83c', 0.95));
const sun = new THREE.DirectionalLight('#fff4d6', 0.55);
sun.position.set(15, 30, 10);
scene.add(sun);

const lam = (c) => new THREE.MeshLambertMaterial({ color: c });
const box = (w, h, d, c) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), lam(c));
const flat = (geo, c, y) => { const m = new THREE.Mesh(geo, lam(c)); m.rotation.x = -Math.PI / 2; m.position.y = y; return m; };

// ---------- textures for emoji, signs, bubbles ----------
const texCache = new Map();
function emojiTex(e, badge) {
  const key = e + (badge || '');
  if (texCache.has(key)) return texCache.get(key);
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.font = '200px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(e, 128, 140);
  if (badge) {
    g.fillStyle = badge; g.strokeStyle = '#fff'; g.lineWidth = 10;
    g.beginPath(); g.roundRect ? g.roundRect(168, 160, 62, 62, 12) : g.rect(168, 160, 62, 62); g.fill(); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  texCache.set(key, t);
  return t;
}
function textTex(text, { w = 512, h = 128, bg = '#fffaf0', fg = '#1d2251', border = '#8a5a3b', size = 72 } = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = bg; g.strokeStyle = border; g.lineWidth = 12;
  g.beginPath(); g.roundRect ? g.roundRect(6, 6, w - 12, h - 12, 28) : g.rect(6, 6, w - 12, h - 12); g.fill(); g.stroke();
  g.fillStyle = fg; g.font = `bold ${size}px "Chalkboard SE", ui-rounded, sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, w / 2, h / 2 + 4);
  return new THREE.CanvasTexture(c);
}
function sprite(tex, size) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.set(size, size, 1);
  return s;
}
const shadowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const r = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  r.addColorStop(0, 'rgba(0,0,0,0.35)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
function blob(size) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.03;
  return m;
}

// ---------- world ----------
const LOOP_R = 12, PEN_R = 19.5, GATE_Z = 26, START_Z = 33;
scene.add(flat(new THREE.PlaneGeometry(300, 300), '#6cc24a', 0));
scene.add(flat(new THREE.RingGeometry(LOOP_R - 1.3, LOOP_R + 1.3, 80), '#f2d49b', 0.01));
const entrance = flat(new THREE.PlaneGeometry(2.6, START_Z - LOOP_R + 2), '#f2d49b', 0.012);
entrance.position.z = (START_Z + LOOP_R) / 2;
scene.add(entrance);
const plaza = flat(new THREE.CircleGeometry(4, 32), '#f2d49b', 0.011);
plaza.position.set(0, 0.011, 0);
scene.add(plaza);
const fountain = sprite(emojiTex('⛲'), 4); fountain.position.set(0, 2, 0); scene.add(fountain);

// trees around the outside
for (let i = 0; i < 46; i++) {
  const a = (i / 46) * Math.PI * 2 + Math.random() * 0.1;
  if (Math.abs(Math.sin(a / 2)) < 0.12) continue; // keep the gate approach clear
  const r = 27 + Math.random() * 10;
  const t = new THREE.Group();
  const trunk = box(0.5, 1.6, 0.5, '#7a4b2a'); trunk.position.y = 0.8;
  const top = new THREE.Mesh(new THREE.ConeGeometry(1.6 + Math.random() * 0.6, 3.4, 7), lam(i % 3 ? '#3f9a3a' : '#2f7d33'));
  top.position.y = 3.1;
  t.add(trunk, top);
  t.position.set(Math.sin(a) * r, 0, Math.cos(a) * r);
  scene.add(t);
}

// gate
const gate = new THREE.Group();
gate.position.z = GATE_Z;
const postL = box(0.9, 5.5, 0.9, '#8a5a3b'); postL.position.set(-2.4, 2.75, 0);
const postR = postL.clone(); postR.position.x = 2.4;
const archSign = new THREE.Mesh(new THREE.BoxGeometry(6.6, 1.6, 0.5), [lam('#8a5a3b'), lam('#8a5a3b'), lam('#8a5a3b'), lam('#8a5a3b'),
  new THREE.MeshBasicMaterial({ map: textTex('🦒 ZOO 🐘', { bg: '#8a5a3b', fg: '#fff3c4', border: '#5d3a22', size: 84 }) }), lam('#8a5a3b')]);
archSign.position.y = 5.8;
gate.add(postL, postR, archSign);
function makeDoor(side) {
  const pivot = new THREE.Group();
  pivot.position.set(side * 1.95, 0, 0);
  for (let i = 0; i < 6; i++) {
    const bar = box(0.12, 3.6, 0.12, '#b8b8b8');
    bar.position.set(-side * (0.2 + i * 0.33), 1.9, 0);
    pivot.add(bar);
  }
  for (const y of [0.4, 3.5]) {
    const rail = box(1.95, 0.2, 0.14, '#9a9a9a');
    rail.position.set(-side * 0.98, y, 0);
    pivot.add(rail);
  }
  gate.add(pivot);
  return pivot;
}
const doors = [makeDoor(-1), makeDoor(1)];
scene.add(gate);

// fence line on both sides of the gate
for (const side of [-1, 1]) {
  for (let i = 0; i < 12; i++) {
    const p = box(0.25, 1.4, 0.25, '#8a5a3b');
    p.position.set(side * (3.5 + i * 1.6), 0.7, GATE_Z);
    scene.add(p);
  }
  const rail = box(18, 0.18, 0.12, '#8a5a3b');
  rail.position.set(side * 12.3, 1.1, GATE_Z);
  scene.add(rail);
}

// pens
const pens = ANIMALS.map((a, i) => {
  const ang = THREE.MathUtils.degToRad(22 + (i * 316) / (ANIMALS.length - 1));
  const center = new THREE.Vector3(Math.sin(ang) * PEN_R, 0, Math.cos(ang) * PEN_R);
  const g = new THREE.Group();
  g.position.copy(center);
  g.lookAt(0, 0, 0);
  const grass = box(5, 0.08, 5, '#8fd66a'); grass.position.y = 0.04; g.add(grass);
  const S = 2.5;
  for (const [x, z, w, d] of [[0, S, 5, 0.12], [0, -S, 5, 0.12], [S, 0, 0.12, 5], [-S, 0, 0.12, 5]]) {
    for (const y of [0.45, 0.95]) { const r = box(w, 0.12, d, '#8a5a3b'); r.position.set(x, y, z); g.add(r); }
  }
  for (const x of [-S, -S / 2, 0, S / 2, S]) for (const z of [-S, S]) { const p = box(0.18, 1.2, 0.18, '#7a4b2a'); p.position.set(x, 0.6, z); g.add(p); }
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 0.65), new THREE.MeshBasicMaterial({ map: textTex(a.name) }));
  sign.position.set(0, 1.55, S + 0.1); g.add(sign);
  scene.add(g);
  const animal = sprite(emojiTex(a.emoji), 3.4);
  animal.position.set(center.x, 1.75, center.z);
  scene.add(animal);
  const sh = blob(3); sh.position.x = center.x; sh.position.z = center.z; scene.add(sh);
  const out = center.clone().normalize();
  return { a, ang, center, animal, out, visits: 0, baseY: 1.75 };
});

// ---------- tiny animation system ----------
const tasks = new Set();
const anim = (ms, fn) => new Promise((done) => { const t0 = performance.now(); tasks.add({ t0, ms, fn, done }); });
const sleep = (ms) => anim(ms, () => {});

// confetti (3D)
const confetti = [];
const confGeo = new THREE.PlaneGeometry(0.22, 0.14);
function burst(pos, color) {
  const cols = [color, color, '#ffffff', '#ffd43b', '#ff7a3d'];
  for (let i = 0; i < 140; i++) {
    const m = new THREE.Mesh(confGeo, new THREE.MeshBasicMaterial({ color: cols[i % cols.length], side: THREE.DoubleSide }));
    m.position.copy(pos);
    const v = new THREE.Vector3((Math.random() - 0.5) * 9, 5 + Math.random() * 7, (Math.random() - 0.5) * 9);
    confetti.push({ m, v, spin: new THREE.Vector3(Math.random() * 8, Math.random() * 8, Math.random() * 8), life: 0 });
    scene.add(m);
  }
}

// camera
const OVER_POS = new THREE.Vector3(0, 30, 44), OVER_LOOK = new THREE.Vector3(0, 0, 4);
camera.position.copy(OVER_POS);
const camLook = OVER_LOOK.clone();
let follow = null; // { target: Object3D, dir: Vector3 }

function pointOnLoop(ang, r = LOOP_R) { return new THREE.Vector3(Math.sin(ang) * r, 0, Math.cos(ang) * r); }

async function walk(kid, to, speed = 5.5) {
  const from = kid.position.clone(); from.y = 0;
  const target = to.clone();
  const dist = from.distanceTo(target);
  if (dist < 0.01) return;
  follow.dir.copy(target).sub(from).normalize();
  await anim((dist / speed) * 1000, (t) => {
    kid.position.lerpVectors(from, target, t);
    kid.position.y = 1.15 + Math.abs(Math.sin(t * dist * 2.2)) * 0.35;
  });
  kid.position.y = 1.15;
}

let busy = Promise.resolve();
function visit(i) {
  busy = busy.then(() => runVisit(i));
  return busy;
}

async function runVisit(i) {
  const pen = pens[i];
  const a = pen.a;
  const n = pen.visits++;
  const kid = sprite(emojiTex(KIDS[(i + n) % KIDS.length], a.color), 2.3);
  kid.position.set(0, 1.15, START_Z);
  const sh = blob(1.8);
  scene.add(kid, sh);
  const syncShadow = () => { sh.position.x = kid.position.x; sh.position.z = kid.position.z; };
  tasks.add({ t0: performance.now(), ms: Infinity, fn: syncShadow, done() {} });
  follow = { target: kid, dir: new THREE.Vector3(0, 0, -1) };

  await walk(kid, new THREE.Vector3(0, 0, GATE_Z + 1.4));
  // gate opens with confetti
  burst(new THREE.Vector3(0, 5.5, GATE_Z), a.color);
  await anim(600, (t) => { const e = 1 - (1 - t) ** 3; doors[0].rotation.y = -e * 1.9; doors[1].rotation.y = e * 1.9; });
  await walk(kid, new THREE.Vector3(0, 0, LOOP_R));
  anim(700, (t) => { const e = 1 - (1 - t) ** 3; doors[0].rotation.y = -(1 - e) * 1.9; doors[1].rotation.y = (1 - e) * 1.9; });

  // along the loop, shortest way round
  let target = pen.ang > Math.PI ? pen.ang - Math.PI * 2 : pen.ang;
  const steps = Math.max(2, Math.ceil(Math.abs(target) / 0.25));
  for (let s = 1; s <= steps; s++) await walk(kid, pointOnLoop((target * s) / steps));
  const spread = ((n % 3) - 1) * 1.1;
  const side = new THREE.Vector3(pen.out.z, 0, -pen.out.x).multiplyScalar(spread);
  await walk(kid, pen.center.clone().sub(pen.out.clone().multiplyScalar(3.6)).add(side));
  follow.dir.copy(pen.out);

  // happy animal: jump + hearts
  anim(900, (t) => { pen.animal.position.y = pen.baseY + Math.abs(Math.sin(t * Math.PI * 2)) * 1.6; });
  for (let h = 0; h < 6; h++) {
    const heart = sprite(emojiTex('❤️'), 0.9);
    heart.position.copy(pen.animal.position).add(new THREE.Vector3((Math.random() - 0.5) * 2, 1.2, (Math.random() - 0.5) * 2));
    scene.add(heart);
    const y0 = heart.position.y;
    anim(1300 + h * 100, (t) => { heart.position.y = y0 + t * 3; heart.material.opacity = 1 - t; })
      .then(() => scene.remove(heart));
  }
  await sleep(900);

  // feed: toss food in an arc
  const food = sprite(emojiTex(a.food), 1.1);
  const f0 = kid.position.clone().add(new THREE.Vector3(0, 0.8, 0));
  const f1 = pen.animal.position.clone();
  scene.add(food);
  await anim(700, (t) => {
    food.position.lerpVectors(f0, f1, t);
    food.position.y += Math.sin(t * Math.PI) * 3;
    food.material.rotation = t * 6;
  });
  scene.remove(food);
  const yum = sprite(textTex('Yum!', { w: 256, h: 128, border: '#1d2251', size: 80 }), 2.2);
  yum.scale.set(2.6, 1.3, 1);
  yum.position.copy(pen.animal.position).add(new THREE.Vector3(0, 2.6, 0));
  scene.add(yum);
  await anim(600, (t) => { const s = 3.4 * (1 + Math.sin(t * Math.PI * 3) * 0.15); pen.animal.scale.set(s, s, 1); });
  await sleep(900);
  scene.remove(yum);
  follow = null;
  await sleep(600);
}

// ---------- main loop ----------
let last = performance.now();
const tmpPos = new THREE.Vector3(), tmpLook = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  for (const t of tasks) {
    const p = Math.min(1, (now - t.t0) / t.ms);
    t.fn(p);
    if (p >= 1) { tasks.delete(t); t.done(); }
  }
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.life += dt;
    if (c.m.position.y > 0.05) {
      c.v.y -= 9 * dt; c.v.multiplyScalar(0.985);
      c.m.position.addScaledVector(c.v, dt);
      c.m.rotation.x += c.spin.x * dt; c.m.rotation.y += c.spin.y * dt; c.m.rotation.z += c.spin.z * dt;
    } else {
      c.m.position.y = 0.05; c.m.rotation.set(-Math.PI / 2, 0, c.m.rotation.z);
    }
    if (c.life > 9) { scene.remove(c.m); confetti.splice(i, 1); }
  }
  for (const pen of pens) pen.animal.position.y += Math.sin(now / 400 + pen.ang * 5) * 0.002;

  if (follow) {
    tmpPos.copy(follow.target.position).addScaledVector(follow.dir, -8).add(new THREE.Vector3(0, 4.2, 0));
    tmpLook.copy(follow.target.position).addScaledVector(follow.dir, 4).setY(1.2);
    camera.position.lerp(tmpPos, 0.05);
    camLook.lerp(tmpLook, 0.08);
  } else {
    camera.position.lerp(OVER_POS, 0.03);
    camLook.lerp(OVER_LOOK, 0.04);
  }
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);

// ---------- controls ----------
let next = 0;
const hint = document.getElementById('hint');
const showNext = () => { hint.textContent = `Next: ${ANIMALS[next].emoji} ${ANIMALS[next].name}'s zookeeper`; };
showNext();
document.getElementById('go').addEventListener('click', () => {
  visit(next);
  next = (next + 1) % ANIMALS.length;
  showNext();
});
document.getElementById('all').addEventListener('click', () => {
  for (let k = 0; k < ANIMALS.length; k++) { visit(next); next = (next + 1) % ANIMALS.length; }
  showNext();
});
</script>
</body>
</html>
