name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: fmt
        run: cargo fmt --manifest-path server/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - name: unit tests
        run: cargo test --manifest-path server/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: e2e
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: TapClient and sticker-edge checks
        working-directory: ios
        run: |
          swiftc ClassroomZoo/TapClient.swift ClassroomZoo/StickerEdges.swift Tests/*.swift -o "$RUNNER_TEMP/tapcheck"
          "$RUNNER_TEMP/tapcheck"
          swiftc -O Tools/clean-sticker/main.swift ClassroomZoo/StickerEdges.swift -o "$RUNNER_TEMP/clean-sticker"
      - name: Build app (simulator, unsigned)
        working-directory: ios
        run: |
          xcodebuild -project ClassroomZoo.xcodeproj -scheme ClassroomZoo \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  phone-page:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Phone + page e2e (Zookeeper in the simulator)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium
          npm run test:phone
